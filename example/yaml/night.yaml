name: night

images:
  return:
    ltr: ../icon/night/fr/return.png
    rtl: ../icon/night/ar/return.png
  paint: ../icon/night/fr/paint.png

styles:
  screen:
    selectors: [":screen"]
    props:
      bg_color: night_screen_bg
      bg_opa: LV_OPA_COVER
      text_color: night_text
      text_font: body

  button:
    selectors: ["button"]
    props:
      bg_color: night_button_bg
      bg_opa: LV_OPA_COVER
      border_color: night_button_border
      border_width: 1
      radius: 8
      text_color: night_button_text
      pad_all: 4

  button_pressed:
    selectors: ["button:pressed"]
    props:
      bg_color: night_button_pressed

  button_disabled:
    selectors: ["button:disabled"]
    props:
      opa: LV_OPA_50
